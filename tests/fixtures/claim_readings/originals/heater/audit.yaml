# PhysicsGuard hierarchical audit model
# Purpose: shower mix.
# Repository: https://github.com/liuyingxuvka/PhysicsGuard
# Use with: python -m physicsguard.cli hierarchy run examples/hierarchical/shower_mix/audit.yaml --pretty
# Boundary: Low-fidelity SI-unit residual audit only; not a high-fidelity solver, commercial-tool adapter, or reverse-engineered model.
audit_name: shower_mix
system:
  system_name: shower_mix
  components:
    - id: heater
      type: CoolantHeatBalanceModule
      parameters: {cp_J_kgK: 4186.0, residual_scale_W: 100.0}
    - id: mix
      type: FlowMergeTemperatureModule
      parameters: {mass_residual_scale_kg_s: 0.001, energy_residual_scale_kgK_s: 0.05}
  connections:
    - {from_variable: heater.m_dot_kg_s, to_variable: mix.m_dot_1_kg_s}
    - {from_variable: heater.T_out_K, to_variable: mix.T_1_K}
    - {from_variable: heater.T_in_K, to_variable: mix.T_2_K}
  boundaries: []
  assumptions: []
hierarchy:
  blocks:
    - {id: supply, name: Shower supply, level: 0, components: []}
    - {id: hot_branch, name: Inline heater, level: 1, parent_id: supply, components: [heater]}
    - {id: mixer, name: Mixing tee, level: 1, parent_id: supply, components: [mix]}
fault_variants:
  - id: mix_arithmetic_mean
    kind: fault
    changes: [{variable: mix.T_out_K, offset: 4.5}]
    expect_blocks: [mixer]
  - id: heater_flow_per_minute
    kind: fault
    changes: [{variable: heater.Q_dot_W, scale: 60.0}]
    expect_blocks: [hot_branch]
