name: LogicWriting CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out the current source
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Clone ResearchGuard
        run: git clone --depth 1 https://github.com/liuyingxuvka/ResearchGuard.git "$RUNNER_TEMP/ResearchGuard"
      - name: Install test dependencies
        run: python -m pip install pytest PyYAML "$RUNNER_TEMP/ResearchGuard" "flowguard @ git+https://github.com/liuyingxuvka/FlowGuard.git@v0.70.11"
      - name: Run tests
        timeout-minutes: 20
        env:
          RESEARCHGUARD_SOURCE_ROOT: ${{ runner.temp }}/ResearchGuard
        run: python -m pytest -q
      - name: Run fiction regression
        run: python scripts/run_fiction_regression.py --repository-root . --json
      - name: Run travel regression
        run: python scripts/run_travel_regression.py --repository-root . --json
      - name: Check the map
        run: python -m flowguard map check
      - name: Verify the release contracts
        run: python -m flowguard release
      - name: Install and check the skill bytes
        run: |
          python scripts/install_skill.py --target "$RUNNER_TEMP/skills"
          python scripts/install_skill.py --target "$RUNNER_TEMP/skills" --check

  researchguard-minimum:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out the selected source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install ResearchGuard at the declared minimum
        run: |
          minimum="$(cd skills/logic-writing/scripts && python -c 'from _common import RESEARCHGUARD_MIN_VERSION as v; print(".".join(map(str, v)))')"
          python -m pip install pytest PyYAML "git+https://github.com/liuyingxuvka/ResearchGuard.git@v$minimum"

      - name: Run tests and member preflights on the minimum
        run: |
          python -m pytest -q
          for member in researchguard logicguard sourceguard traceguard; do python skills/logic-writing/scripts/provider_preflight.py "$member"; done

